stages:
  - install
  - quality
  - build
  - deploy

variables:
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

.bun_cache:
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules/

.on_any_env:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      changes:
        - frontend/**/*
        - Backend/**/*
        - k8s/**/*
        - .gitlab-ci.yml
        - bun.lock

# Install

install:
  extends:
    - .bun_cache
    - .on_any_env
  stage: install
  image: oven/bun:1
  script:
    - bun install --frozen-lockfile

# Quality

eslint:
  extends:
    - .bun_cache
    - .on_any_env
  stage: quality
  image: oven/bun:1
  needs: [install]
  script:
    - bunx eslint .

prettier:
  extends:
    - .bun_cache
    - .on_any_env
  stage: quality
  image: oven/bun:1
  needs: [install]
  script:
    - bunx prettier --check .

# Build

.build_base:
  extends: .on_any_env
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [eslint, prettier]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# main → :production  |  master → :staging

.tag_and_push: &tag_and_push |
  ENV_TAG=$([ "$CI_COMMIT_BRANCH" = "main" ] && echo "production" || echo "staging")
  docker tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE}:${ENV_TAG}"
  docker push "${IMAGE}:${ENV_TAG}"

build_frontend:
  extends: .build_base
  script:
    - export IMAGE=$FRONTEND_IMAGE
    - docker build --cache-from "${IMAGE}:staging" -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" ./frontend
    - docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - *tag_and_push

build_backend:
  extends: .build_base
  script:
    - export IMAGE=$BACKEND_IMAGE
    - docker build --cache-from "${IMAGE}:staging" -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" ./Backend
    - docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - *tag_and_push

# Deploy

.deploy_base:
  stage: deploy
  image: alpine/k8s:1.34.7
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config

deploy_staging:
  extends: .deploy_base
  needs: [build_frontend, build_backend]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment:
    name: staging
    url: https://staging-volly.labb.k3s.chas-lab.dev
  script:
    - kubectl apply -f k8s/staging/ -n doe25-simon-klausen
    - kubectl rollout restart deployment/frontend-staging -n doe25-simon-klausen
    - kubectl rollout restart deployment/backend-staging -n doe25-simon-klausen

deploy_production:
  extends: .deploy_base
  needs: [build_frontend, build_backend]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
    url: https://volly.labb.k3s.chas-lab.dev
  script:
    - kubectl apply -f k8s/production/ -n doe25-simon-klausen
    - kubectl rollout restart deployment/frontend-production -n doe25-simon-klausen
    - kubectl rollout restart deployment/backend-production -n doe25-simon-klausen