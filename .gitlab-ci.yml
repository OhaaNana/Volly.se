stages:
  - install
  - quality
  - build
  - deploy
  - cleanup

variables:
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

.bun_cache:
  cache:
    key:
      files:
        - bun.lock
    paths:
      - Backend/node_modules/
      - frontend/node_modules/

.bun_cache_pull:
  cache:
    key:
      files:
        - bun.lock
    paths:
      - Backend/node_modules/
      - frontend/node_modules/
    policy: pull

.on_any_env:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      changes:
        - frontend/**/*
        - Backend/**/*
        - k8s/**/*
        - .gitlab-ci.yml
        - bun.lock

# Install

install:
  extends:
    - .bun_cache
    - .on_any_env
  stage: install
  image: oven/bun:1
  script:
    - cd Backend && bun install --frozen-lockfile && cd ..
    - cd frontend && bun install

# Quality

eslint:
  extends:
    - .bun_cache_pull
    - .on_any_env
  stage: quality
  image: oven/bun:1
  needs: [install]
  script:
    - bunx eslint .

prettier:
  extends:
    - .bun_cache_pull
    - .on_any_env
  stage: quality
  image: oven/bun:1
  needs: [install]
  script:
    - bunx prettier --check .

# Build

.build_base:
  extends: .on_any_env
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [eslint, prettier]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# main → :production  |  master → :staging

.tag_and_push: &tag_and_push |
  ENV_TAG=$([ "$CI_COMMIT_BRANCH" = "main" ] && echo "production" || echo "staging")
  docker tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE}:${ENV_TAG}"
  docker push "${IMAGE}:${ENV_TAG}"

build_frontend:
  extends: .build_base
  artifacts:
    expire_in: 2 days
    paths:
      - dist/
  script:
    - export IMAGE=$FRONTEND_IMAGE
    - docker build --cache-from "${IMAGE}:staging" --build-arg VITE_FORMSUBMIT_EMAIL="${VITE_FORMSUBMIT_EMAIL}" -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" ./frontend
    - docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - *tag_and_push

build_backend:
  extends: .build_base
  script:
    - export IMAGE=$BACKEND_IMAGE
    - docker build --cache-from "${IMAGE}:staging" -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" ./Backend
    - docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - *tag_and_push

# Deploy

.deploy_base:
  stage: deploy
  image: alpine/k8s:1.34.7
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config

deploy_staging:
  extends: .deploy_base
  needs: [build_frontend, build_backend]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment:
    name: staging
    url: https://volly-staging.cc.k3s.chas-lab.dev
  script:
    - kubectl apply -f k8s/staging/ -n doe25-group-15
    - kubectl rollout restart deployment/frontend-staging -n doe25-group-15
    - kubectl rollout restart deployment/backend-staging -n doe25-group-15

deploy_production:
  extends: .deploy_base
  needs: [build_frontend, build_backend]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
    url: https://volly.cc.k3s.chas-lab.dev
  script:
    - kubectl apply -f k8s/production/ -n doe25-group-15
    - kubectl rollout restart deployment/frontend-production -n doe25-group-15
    - kubectl rollout restart deployment/backend-production -n doe25-group-15

# Cleanup

cleanup_registry:
  stage: cleanup
  image: alpine:latest
  needs: [deploy_staging]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - apk add --no-cache curl jq
    - |
      REPOS=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories")
      for REPO_ID in $(echo $REPOS | jq -r '.[].id'); do
        OLD_TAGS=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$REPO_ID/tags" | \
          jq -r '[.[] | select(.name | test("^[0-9a-f]{8}$"))] | sort_by(.created_at) | reverse | .[5:] | .[].name')
        for TAG in $OLD_TAGS; do
          curl -s --request DELETE --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$REPO_ID/tags/$TAG"
        done
      done