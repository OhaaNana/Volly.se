stages:
  - install
  - quality
  - build
  - deploy

variables:
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  DOCKER_DRIVER: overlay2

.bun_cache:
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules/

.on_any_env:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH =~ /^feature\/.+/

# ── Install ───────────────────────────────────────────────────────
install:
  extends:
    - .bun_cache
    - .on_any_env
  stage: install
  image: oven/bun:1
  script:
    - bun install --frozen-lockfile

# ── Quality ───────────────────────────────────────────────────────
eslint:
  extends:
    - .bun_cache
    - .on_any_env
  stage: quality
  image: oven/bun:1
  needs: [install]
  script:
    - bunx eslint .

prettier:
  extends:
    - .bun_cache
    - .on_any_env
  stage: quality
  image: oven/bun:1
  needs: [install]
  script:
    - bunx prettier --check .

# ── Build ─────────────────────────────────────────────────────────
.build_base:
  extends: .on_any_env
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [eslint, prettier]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# main → :latest  |  master → :staging  |  feature → :review-<slug>
.tag_and_push: &tag_and_push |
  if [ "$CI_COMMIT_BRANCH" = "main" ]; then
    ENV_TAG="latest"
  elif [ "$CI_COMMIT_BRANCH" = "master" ]; then
    ENV_TAG="staging"
  else
    ENV_TAG="review-${CI_COMMIT_REF_SLUG}"
  fi
  docker tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE}:${ENV_TAG}"
  docker push "${IMAGE}:${ENV_TAG}"

build_frontend:
  extends: .build_base
  script:
    - export IMAGE=$FRONTEND_IMAGE
    - docker build -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" ./frontend
    - docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - *tag_and_push

build_backend:
  extends: .build_base
  script:
    - export IMAGE=$BACKEND_IMAGE
    - docker build -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" ./Backend
    - docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - *tag_and_push

# ── Deploy ────────────────────────────────────────────────────────
.deploy_base:
  stage: deploy
  image: bitnami/kubectl:latest
  variables:
  before_script:
    - echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig

deploy_review:
  extends: .deploy_base
  needs: [build_frontend, build_backend]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^feature\/.+/
  environment:
    name: developer/$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG.doe25.swarm.chas-lab.dev
    on_stop: stop_review
  script:
    - kubectl apply -f k8s/staging/ -n doe25-simon-klausen

stop_review:
  extends: .deploy_base
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^feature\/.+/
      when: manual
  environment:
    name: developer/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - echo "Stopping review environment $CI_COMMIT_REF_SLUG"

deploy_staging:
  extends: .deploy_base
  needs: [build_frontend, build_backend]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment:
    name: staging
    url: https://staging.doe25.swarm.chas-lab.dev
  script:
    - kubectl apply -f k8s/staging/ -n doe25-simon-klausen

deploy_production:
  extends: .deploy_base
  needs: [build_frontend, build_backend]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
    url: https://zero-bug-heroes.doe25.swarm.chas-lab.dev
  script:
    - kubectl apply -f k8s/staging/ -n doe25-simon-klausen
