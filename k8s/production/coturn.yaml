apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config-production
  namespace: doe25-group-15
data:
  turnserver.conf: |
    listening-port=3478
    fingerprint
    use-auth-secret
    # MUST equal the TURN_SECRET GitLab CI/CD variable used for backend-secrets-prod
    static-auth-secret=6374e6cae5e4e31478cd6c575733311853a95e1631c1f18f709a872e3f11171c
    realm=volly.cc.k3s.chas-lab.dev
    no-cli
    log-file=stdout
    # Public IP of the node this coturn runs on (must match backend TURN_HOST)
    external-ip=REPLACE_WITH_PRODUCTION_TURN_PUBLIC_IP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn-production
  namespace: doe25-group-15
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coturn-production
  template:
    metadata:
      labels:
        app: coturn-production
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Staging coturn binds host UDP 3478 on cc-wp-1. Two coturns cannot share
      # that port on the same node — pin production to a DIFFERENT node.
      nodeName: cc-wp-1
      containers:
        - name: coturn
          image: coturn/coturn:latest
          args: ["-c", "/etc/coturn/turnserver.conf"]
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
      volumes:
        - name: config
          configMap:
            name: coturn-config-production
---
apiVersion: v1
kind: Service
metadata:
  name: coturn-production
  namespace: doe25-group-15
spec:
  type: LoadBalancer
  selector:
    app: coturn-production
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      protocol: UDP
