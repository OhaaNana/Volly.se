apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-production
  namespace: doe25-group-15
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-production
  template:
    metadata:
      labels:
        app: backend-production
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: backend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-15/zero-bug-heroes/zero-bug-heroes/backend:production
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: postgres://postgres:postgres@postgres-production:5432/postgres
            - name: POSTGRES_URI
              value: postgres://postgres:postgres@postgres-production:5432/postgres
            - name: CORS_ORIGIN
              value: "https://volly.cc.k3s.chas-lab.dev"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_REFRESH_SECRET
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/chat/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/chat/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-production
  namespace: doe25-group-15
  labels:
    app: backend-production
spec:
  selector:
    app: backend-production
  ports:
    - name: http
      port: 3001
      targetPort: 3001
