apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-production
  namespace: doe25-group-15
  labels:
    release: monitoring
spec:
  groups:
    - name: backend-production.rules
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="doe25-group-15", job="backend-production", statusCode=~"5.."}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="doe25-group-15", job="backend-production"}[5m])) > 0.05
          for: 1m
          labels:
            severity: warning
            env: production
          annotations:
            summary: "High 5xx error rate on backend-production"
            description: "More than 5% of requests are returning 5xx errors."

        - alert: NoTraffic
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="doe25-group-15", job="backend-production"}[5m])) == 0
          for: 5m
          labels:
            severity: info
            env: production
          annotations:
            summary: "No traffic on backend-production"
            description: "backend-production has received no requests in the last 5 minutes."
