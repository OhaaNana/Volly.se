apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-dashboard-production
  namespace: doe25-group-15
  labels:
    grafana_dashboard: "1"
data:
  backend-dashboard-production.json: |
    {
      "title": "Zero Bug Heroes – Backend (Production)",
      "uid": "zbh-backend-production",
      "schemaVersion": 36,
      "version": 2,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count{job=\"backend-production\"}[1m]))",
              "legendFormat": "requests/s"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate (5xx %)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count{job=\"backend-production\", statusCode=~\"5..\"}[1m])) / sum(rate(http_request_duration_seconds_count{job=\"backend-production\"}[1m])) * 100",
              "legendFormat": "5xx %"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency p95 (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"backend-production\"}[1m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 4,
          "title": "Requests by Status Code",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (statusCode) (rate(http_request_duration_seconds_count{job=\"backend-production\"}[1m]))",
              "legendFormat": "{{ statusCode }}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Traefik Ingress",
          "type": "row",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "id": 6,
          "title": "Traefik – Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 17, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\"doe25-group-15-backend-production.*\"}[1m]))",
              "legendFormat": "backend"
            },
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\"doe25-group-15-frontend-production.*\"}[1m]))",
              "legendFormat": "frontend"
            }
          ]
        },
        {
          "id": 7,
          "title": "Traefik – Error Rate (5xx %)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 17, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\"doe25-group-15-backend-production.*\", code=~\"5..\"}[1m])) / sum(rate(traefik_service_requests_total{service=~\"doe25-group-15-backend-production.*\"}[1m])) * 100",
              "legendFormat": "5xx %"
            }
          ]
        },
        {
          "id": 8,
          "title": "Traefik – Latency p95 (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 25, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket{service=~\"doe25-group-15-backend-production.*\"}[1m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 9,
          "title": "Traefik – Requests by Status Code",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 25, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (code) (rate(traefik_service_requests_total{service=~\"doe25-group-15-backend-production.*\"}[1m]))",
              "legendFormat": "{{ code }}"
            }
          ]
        }
      ]
    }
