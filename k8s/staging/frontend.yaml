apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-staging
  namespace: doe25-group-15
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-staging
  template:
    metadata:
      labels:
        app: frontend-staging
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: frontend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-15/zero-bug-heroes/zero-bug-heroes/frontend:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 4173
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-staging
  namespace: doe25-group-15
spec:
  selector:
    app: frontend-staging
  ports:
    - port: 4173
      targetPort: 4173
