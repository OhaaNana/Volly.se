apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-staging-ingress
  namespace: doe25-group-15
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`staging-volly.labb.k3s.chas-lab.dev`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: backend-staging
          port: 3001
    - match: Host(`staging-volly.labb.k3s.chas-lab.dev`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: frontend-staging
          port: 3000
  tls: {}