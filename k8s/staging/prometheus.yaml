apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: doe25-group-15
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'volly-backend'
        static_configs:
          - targets: ['backend-staging:3001']

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: doe25-group-15
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: doe25-group-15
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
