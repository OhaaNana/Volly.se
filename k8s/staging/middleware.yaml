apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers-staging
  namespace: doe25-group-15
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
      Server: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-rate-limit-staging
  namespace: doe25-group-15
spec:
  rateLimit:
    average: 200
    burst: 100
