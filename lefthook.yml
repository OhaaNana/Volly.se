pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "**/*.{js,jsx,ts,tsx,json,css}"
      run: bunx prettier --write --log-level warn {staged_files}
      stage_fixed: true

    eslint:
      glob: "**/*.{js,jsx,ts,tsx}"
      run: bunx eslint --fix {staged_files}
      stage_fixed: true